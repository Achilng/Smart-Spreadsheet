<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画风提取 · Luna</title>
<style>
:root{font:15px/1.65 'Microsoft YaHei',system-ui,sans-serif;color:#24302d;background:#f4f6f4}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;padding:44px 28px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:26px}h1{font-size:29px;letter-spacing:-1px;margin:3px 0}h2{font-size:18px;margin:0 0 14px}p{color:#5c6964;margin:5px 0 18px}small{font-size:13px;color:#5c6964}.eyebrow{color:#397554;letter-spacing:2px;font-size:12px;font-weight:bold}.connection{border:1px solid #d5dfd8;background:white;border-radius:24px;padding:6px 14px;font-size:13px;white-space:nowrap}.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px}.card{background:white;border:1px solid #dfe5df;border-radius:18px;padding:23px;margin-bottom:20px;box-shadow:0 3px 16px #19352204}label{display:block;margin:14px 0 6px;font-size:14px}input,select,button{font:inherit}input[type=number],select{width:100%;padding:9px;border:1px solid #cad4cd;border-radius:8px;background:white}input[type=file]{width:100%;font-size:13px}button{border:1px solid #cdd8cf;border-radius:9px;background:white;color:#24412d;padding:9px 14px;cursor:pointer}button.primary{background:#28633f;color:white;border-color:#28633f}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stats b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}.stats small{display:block}.track{height:12px;background:#e8eee9;border-radius:8px;overflow:hidden}.fill{height:100%;background:#408653;width:0;transition:width .3s}.row{display:flex;justify-content:space-between;gap:12px;margin:10px 0}.log{font-size:13px;max-height:210px;overflow:auto;border-top:1px solid #e4e9e5;margin-top:18px;padding-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a33426;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:70px 24px;text-align:center;color:#718078}.failures{max-height:220px;overflow:auto}.failures p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.jobpick{margin-bottom:14px}code{font-size:12px;overflow-wrap:anywhere}.hidden{display:none}footer{font-size:13px;color:#6e7972;margin-top:18px}@media(max-width:760px){main{padding:22px 16px}.grid{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<main><header><div><span class="eyebrow">SMART SPREADSHEET / LUNA</span><h1>提取画风，保留原文。</h1><p>导入待处理 JSON，结果可带回智能表格。</p></div><span class="connection" id="connection">正在连接…</span></header>
<div class="grid"><aside><section class="card"><h2>新建处理任务</h2><label for="file">待处理 JSON</label><input id="file" type="file" accept=".json,application/json"><label for="batch">每次调用处理的条数</label><input id="batch" type="number" min="1" max="100" value="10"><small>默认 10 条。正文较长时自动缩小批次，单条原文不会截断。</small><label for="effort">推理等级</label><select id="effort"><option value="high">High · 优先保证识别质量</option><option value="medium">Medium · 均衡</option><option value="low">Low · 更快</option></select><div class="actions"><button id="create" class="primary">创建任务</button></div><p id="error" class="error" role="alert"></p></section><section class="card"><h2>已保存任务</h2><select id="jobs" aria-label="选择历史任务" class="jobpick"><option value="">暂无任务</option></select><small>关闭网页不影响处理。关闭服务后重新启动，可恢复已保存任务。</small></section></aside>
<article><section id="empty" class="card empty">选择一个待处理文件，或打开已保存任务。</section><section id="detail" class="card hidden"><div class="row"><h2 id="state">等待开始</h2><small>GPT-6 Luna</small></div><small id="identity"></small><div class="stats"><div><b id="done">0</b><small>已成功 / 总数</small></div><div><b id="none">0</b><small>其中无画风</small></div><div><b id="errors">0</b><small>失败</small></div><div><b id="elapsed">00:00</b><small>累计运行时间</small></div></div><div class="track" role="progressbar" id="progress" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill"></div></div><div class="row"><small id="percent">0%</small><small id="calls">尚未调用</small></div><p id="message" aria-live="polite"></p><div class="actions"><button id="start" class="primary">开始 / 继续</button><button id="pause">暂停</button><button id="retry">重试失败项</button><button id="download">下载结果 JSON</button></div><div class="log" id="logs"></div></section><section id="failureCard" class="card hidden"><h2>失败项</h2><div id="failures" class="failures"></div></section><footer>每批完成自动保存 · 成功项不重复处理 · 非空结果必须是连续原文</footer></article></div></main>
<script>
const token='__SESSION_TOKEN__';let selected=localStorage.getItem('style-job')||'',busy=false,current=null;
const $=id=>document.getElementById(id);
async function api(route,body){const r=await fetch('/api/'+route,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Session-Token':token},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'连接失败');return data}
function time(ms){let s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function render(j){current=j;$('empty').classList.toggle('hidden',!!j);$('detail').classList.toggle('hidden',!j);if(!j)return;$('state').textContent={running:'正在提取',paused:'已暂停 / 待开始',completed:'本轮完成'}[j.state];$('identity').textContent='任务 '+j.id.slice(0,8)+' · 每次最多 '+j.settings.batchSize+' 条 · '+j.settings.effort;$('done').textContent=(j.ok+j.none)+' / '+j.total;$('none').textContent=j.none;$('errors').textContent=j.errors;$('elapsed').textContent=time(j.elapsedMs);const p=Math.round((j.ok+j.none+j.errors)/j.total*100);$('fill').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('percent').textContent=p+'% 已处理 · '+j.pending+' 条待处理';$('calls').textContent=j.calls+' 次模型调用';$('message').textContent=j.message;$('start').disabled=busy||j.state==='running'||!j.pending;$('pause').disabled=busy||j.state!=='running';$('retry').disabled=busy||j.state==='running'||!j.errors;$('download').disabled=busy||!(j.ok+j.none+j.errors);$('logs').textContent=j.logs.slice(-14).map(x=>new Date(x.time).toLocaleTimeString()+'  '+x.message).join('\n');$('failureCard').classList.toggle('hidden',!j.errors);$('failures').replaceChildren(...j.failures.map(f=>{const p=document.createElement('p');p.textContent=f.id.slice(0,22)+'…\n'+f.error;return p}));}
async function refresh(){try{const jobs=await api('jobs');$('connection').textContent='已连接 · 进度自动保存';const picker=$('jobs');picker.replaceChildren();for(const j of jobs){const o=document.createElement('option');o.value=j.id;o.textContent=new Date(j.createdAt).toLocaleString()+' · '+j.total+' 条';picker.append(o)}if(!jobs.some(j=>j.id===selected))selected=jobs[0]?.id||'';picker.value=selected;render(jobs.find(j=>j.id===selected)||null);}catch(e){$('connection').textContent=e.message.includes('刷新')?'服务已重启，请刷新网页':'连接中断，正在自动重连';}}
async function perform(fn){if(busy)return;busy=true;$('create').disabled=true;$('error').textContent='';if(current)render(current);try{await fn();await refresh()}catch(e){$('error').textContent=e.message}finally{busy=false;$('create').disabled=false;if(current)render(current)}}
$('create').onclick=()=>perform(async()=>{const file=$('file').files[0];if(!file)throw Error('请先选择待处理 JSON');if(file.size>64*1024*1024)throw Error('文件超过 64 MB');const request=JSON.parse((await file.text()).replace(/^\uFEFF/,''));const j=await api('jobs',{request,settings:{batchSize:Number($('batch').value),effort:$('effort').value}});selected=j.id;localStorage.setItem('style-job',selected)});
$('jobs').onchange=()=>{selected=$('jobs').value;localStorage.setItem('style-job',selected);refresh()};
$('start').onclick=()=>perform(()=>api('jobs/'+selected+'/start',{}));$('pause').onclick=()=>perform(()=>api('jobs/'+selected+'/pause',{}));$('retry').onclick=()=>perform(()=>api('jobs/'+selected+'/start',{retryErrors:true}));
$('download').onclick=()=>perform(async()=>{const doc=await api('jobs/'+selected+'/result');const u=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='画风提取结果-'+selected.slice(0,8)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
refresh();setInterval(refresh,1500);
</script></html>
