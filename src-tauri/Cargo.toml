[package]
name = "smart-spreadsheet"
version = "0.9.1"
edition = "2024"

[lib]
name = "smart_spreadsheet_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1.0"
calamine = "0.35.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
quick-xml = "0.39.4"
rusqlite = { version = "0.39.0", default-features = false, features = ["backup", "bundled"] }
rust_xlsxwriter = "0.95.0"
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order：智绘姬 JSON 去重依赖 presets 键的原始顺序
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sevenz-rust = "0.6.1"
sha2 = "0.10.9"
strsim = "0.11"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-drag = "2.1.1"
thiserror = "2.0.18"
trash = "5.2.6"
unrar-ng = "0.7.7"
walkdir = "2.5.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
